gallery:
  - https://raw.githubusercontent.com/block/buzz/main/docs/assets/screenshots/channel-thread.png
  - https://raw.githubusercontent.com/block/buzz/main/docs/assets/screenshots/channel-agents.png
  - https://raw.githubusercontent.com/block/buzz/main/docs/assets/screenshots/create-channel.png
releaseNotes: >-
  0.1.2: use full container hostnames (jacks-buzz-relay_postgres_1 etc.) —
  Umbrel apps share one Docker network, so bare service names like
  "postgres" can resolve to another app's database.

  0.1.1: fix relay crash-loop (git data dir now chowned to the relay's uid
  before start) and remove the Umbrel login wall from the relay port so the
  Buzz desktop app can connect (PROXY_AUTH_ADD=false, matching the official
  nostr-relay app).

  Initial packaging of buzz-relay for Umbrel.

  Tracks the ghcr.io/block/buzz:main image (Buzz has no stable release tags
  yet). Restart the app to pull the latest relay build.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
