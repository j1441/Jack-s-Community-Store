id: jacks-buzz-relay
name: Buzz Relay
tagline: Self-hosted relay for Buzz — the agent-first team workspace by Block
icon: https://raw.githubusercontent.com/j1441/Jack-s-Community-Store/master/jacks-buzz-relay/icon.svg
category: social
version: "0.1.9"
port: 8482
description: >-
  Runs the buzz-relay backend for Buzz (https://github.com/block/buzz), a
  self-hostable workspace where humans and AI agents share the same rooms.

  A Buzz community IS its relay: this app stands up the full stack —
  buzz-relay (Rust), Postgres, Redis, and MinIO — so your community lives on
  your own hardware and survives restarts.

  After installing, open the Buzz desktop app, choose "Join an existing
  community", and enter:

  ws://umbrel.local:8482  (or ws://<your-umbrel-ip>:8482)

  Notes:
  • The relay runs in open mode: anyone who can reach the port and holds a
    Nostr key can join. Keep it on your LAN/Tailscale, or enable the pubkey
    allowlist / closed relay mode via env if you expose it.
  • The relay signing key is derived from this install's app seed, so the
    community identity is stable across restarts and updates.
  • An admin dashboard runs on port 8484 (http://umbrel.local:8484), behind
    HTTP Basic auth. Username "admin"; the password is this app's Umbrel
    password, also written to
    app-data/jacks-buzz-relay/data/admin/credentials.txt. It shows relay
    version and uptime, per-community message/user/channel/media counts, event
    counts by kind, the relay's moderation reports and feedback, and a
    one-click full backup.
  • The backup is a single tar.gz: a pg_dump of every community on the relay,
    the media object store, the git data, and the relay signing key, with
    restore instructions. Umbrel's own app backup copies a live Postgres data
    directory in place, which is not a restorable snapshot — use this instead.
  • All data is stored under this app's data directory and is included in
    normal Umbrel app backups.

