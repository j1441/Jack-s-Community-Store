releaseNotes: >-
  0.1.9: packaging fixes for 0.1.8 — no feature changes.

  Fixes an exports.sh crash that aborted every install and update (it read
  APP_PASSWORD before umbreld defines it; the fallback now happens in
  docker-compose, where the variable exists). Umbrel's right-click "Show
  default credentials" now shows the admin password (deterministicPassword
  was missing from the manifest). A pre-start hook now syncs the admin/ and
  backup/ directories on every start, because Umbrel updates only copy a
  small file whitelist and never delivered them.

  0.1.8: admin dashboard, full backup, and a pinned relay build.

  The dashboard runs on port 8484 behind HTTP Basic auth (username "admin",
  password = this app's Umbrel password, also written to
  app-data/jacks-buzz-relay/data/admin/credentials.txt). It reports relay
  version and uptime, per-community counts for messages, people, agents,
  channels, git repos, media and live connections, event counts by kind, and
  the relay's own moderation reports and feedback. The relay port is unchanged
  and still unauthenticated, so the desktop app connects exactly as before.

  "Download full backup" streams one tar.gz containing a pg_dump of every
  community on the relay, the media object store, the git data, the relay
  signing key and git-hook secret, and restore instructions. The key is what
  makes a restore the same community rather than a new empty one.

  The relay image is now pinned by digest
  (sha256:80ee929d…, block/buzz@b1b283cd4, 31 Jul 2026) instead of tracking the
  floating :main tag, so each update is a reviewable version bump. Buzz
  versions the relay separately from Buzz Desktop via relay-v* tags; the
  current relay release, 0.2.0, predates the desktop 0.5.3 line, so :main
  remains the right channel.

  Updating in place preserves all community data — app-data is untouched and
  the relay identity still derives from the same seed.

  0.1.2: use full container hostnames (jacks-buzz-relay_postgres_1 etc.) —
  Umbrel apps share one Docker network, so bare service names like
  "postgres" can resolve to another app's database.

  0.1.1: fix relay crash-loop (git data dir now chowned to the relay's uid
  before start) and remove the Umbrel login wall from the relay port so the
  Buzz desktop app can connect (PROXY_AUTH_ADD=false, matching the official
  nostr-relay app).

  Initial packaging of buzz-relay for Umbrel.


dependencies: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
