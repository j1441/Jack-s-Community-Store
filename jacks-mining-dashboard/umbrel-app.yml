releaseNotes: >-
  v2.0.0 — full rebuild.

  • Autopilot: every tick picks the operating point (hashboard count × power target, or off)
  that maximises mining revenue + useful-heat value − marginal electricity cost
  • Hashboard on/off control extends the real power range; switches gated by a one-time cost test
  • Norwegian marginal pricing incl. the monthly strømstøtte/Norgespris cap
  • 48h plan from day-ahead prices; every decision explained in plain language
  • Dry-run first: observes and logs what it would do until you press Go live
  • Safety: chip-temp pause/derate with latched thermal ceiling, watchdog, verified actuation
  • v1 configs migrate automatically (backup kept); starts in dry-run
