releaseNotes: >-
  v2.1.0 — thermostat mode + UI polish.

  • Thermostat: set a target room temperature — measured by the miner's own hashboard
  intake sensors (no extra hardware); heat demand modulates smoothly to hold it
  • The engine still optimises against prices: with a heat pump configured it only runs
  the miner when it is the cheaper way to make that heat
  • Room temp tile on Overview; per-board intake temps on the miner card
  • Control tab: one clean panel per miner; offline miners collapse to compact cards
  • Settings: clearer sections with inline explanations
