manifestVersion: 1
id: jacks-mining-dashboard
name: Mining Dashboard
tagline: Profit + heat autopilot for your Antminer home heater
icon: https://raw.githubusercontent.com/j1441/jacks-mining-dashboard-app/e1424543a5b83fba6620658e73e4f9ec62459c03/icon.svg
category: automation
version: "2.4.0"
port: 3456
description: >-
  Real-time dashboard and autopilot for Antminers running Braiins OS. Perfect for home heating miners.

  Features:
  • Autopilot: picks the operating point (hashboards × power target, or off) that maximises
  mining revenue + useful-heat value − marginal electricity cost
  • Norwegian marginal pricing incl. the monthly strømstøtte/Norgespris cap
  • 48h plan from day-ahead prices; every decision explained in plain language
  • Live hashrate, temperature, fan speed & power monitoring
  • Pool stats & reject rate
  • Responsive dark UI, works with Tailscale

developer: j1441
website: https://github.com/j1441/jacks-mining-dashboard-app
