name: jacks-aiostreams-umbrel (validate + auto-bump)

on:
  push:
    branches: [ master ]
    paths:
      - 'jacks-aiostreams-umbrel/**'
      - '.github/workflows/jacks-aiostreams-umbrel.yml'
  pull_request:
    paths:
      - 'jacks-aiostreams-umbrel/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic file checks
        shell: bash
        run: |
          set -euo pipefail
          test -f jacks-aiostreams-umbrel/umbrel-app.yml
          test -f jacks-aiostreams-umbrel/docker-compose.yml
          test -f jacks-aiostreams-umbrel/icon.svg

      - name: Sanity checks (compose + manifest)
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'APP_HOST: jacks-aiostreams-umbrel_web_1' jacks-aiostreams-umbrel/docker-compose.yml
          grep -q 'SECRET_KEY=\${APP_SEED}' jacks-aiostreams-umbrel/docker-compose.yml
          grep -q 'BASE_URL=' jacks-aiostreams-umbrel/docker-compose.yml
          grep -q 'AIOSTREAMS_AUTH=' jacks-aiostreams-umbrel/docker-compose.yml
          grep -q '^icon: ' jacks-aiostreams-umbrel/umbrel-app.yml

  bump_version:
    # Only bump on direct pushes to master (not PRs), and avoid infinite loops
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump patch version in umbrel-app.yml
        shell: bash
        run: |
          set -euo pipefail
          f="jacks-aiostreams-umbrel/umbrel-app.yml"
          cur=$(grep -E '^version: ' "$f" | head -n1 | sed -E 's/version: "([0-9]+\.[0-9]+\.[0-9]+)"/\1/')
          IFS='.' read -r maj min pat <<< "$cur"
          new="$maj.$min.$((pat+1))"
          sed -i -E "s/^version: \"[0-9]+\.[0-9]+\.[0-9]+\"/version: \"$new\"/" "$f"
          echo "Bumped $cur -> $new"

      - name: Commit + push bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jacks-aiostreams-umbrel/umbrel-app.yml
          git diff --staged --quiet || git commit -m "chore(jacks-aiostreams-umbrel): bump version [skip ci]"
          git push
