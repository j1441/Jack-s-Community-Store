services:
  # NOTE: Umbrel legacy-compat can be finicky with bind-mounting local files.
  # Keep this compose minimal to ensure installs succeed.
  app_proxy:
    environment:
      APP_HOST: jacks-aiostreams-umbrel_aiostreams_1
      APP_PORT: 3000

  # AIOStreams (also exposed on a dedicated host port so FilmBox VPS can reach it over Tailscale)
  aiostreams:
    image: viren070/aiostreams:latest
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3010:3000"
    environment:
      - SECRET_KEY=${APP_SEED}
      - BASE_URL=https://addon.getfilmbox.com
      - ADDON_URLS=https://torrentio.strem.fun/manifest.json
      - AIOSTREAMS_AUTH=admin:${APP_PASSWORD}
