version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<web-container-name>_1
      # Note: the _1 suffix is required by Umbrel
      APP_HOST: jacks-aiostreams-umbrel_proxy_1
      APP_PORT: 3000

  # Tiny path-rewrite proxy.
  # Umbrel forwards requests to the web container with the /app/<app-id>/ prefix intact.
  # AIOStreams expects to be served from / (e.g. /manifest.json), so we strip the prefix.
  proxy:
    image: caddy:2-alpine
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  web:
    image: viren070/aiostreams:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Required by AIOStreams
      - SECRET_KEY=${APP_SEED}

      # IMPORTANT: this should be the *public* URL clients use (through Umbrel proxy)
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}/app/jacks-aiostreams-umbrel

      # Optional: configure which addons AIOStreams aggregates
      - ADDON_URLS=https://torrentio.strem.fun/manifest.json

      # Auth: must be a comma-separated list of username:password pairs
      - AIOSTREAMS_AUTH=admin:${APP_PASSWORD}
