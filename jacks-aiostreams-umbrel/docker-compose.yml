services:
  app_proxy:
    environment:
      APP_HOST: jacks-aiostreams-umbrel_landing_1
      APP_PORT: 80

  # Landing page inside Umbrel UI (NO bind mounts; legacy-compat safe)
  landing:
    image: nginx:alpine
    restart: on-failure
    command:
      - /bin/sh
      - -lc
      - |
        cat > /usr/share/nginx/html/index.html <<'EOF'
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Jack's AIOStreams (Umbrel)</title>
            <style>
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; line-height: 1.4; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
              .box { border: 1px solid #ddd; padding: 16px; border-radius: 10px; max-width: 900px; }
            </style>
          </head>
          <body>
            <h1>Jack's AIOStreams (Umbrel)</h1>
            <div class="box">
              <p>This app runs AIOStreams on a dedicated port to keep Umbrel routing simple.</p>
              <p><b>LAN manifest:</b> <code>http://umbrel.local:3010/stremio/manifest.json</code></p>
              <p><b>LAN configure:</b> <code>http://umbrel.local:3010/stremio/configure</code></p>
              <p><b>Tailscale/VPS:</b> replace <code>umbrel.local</code> with your Umbrel Tailscale IP (e.g. <code>100.90.210.83</code>).</p>
            </div>
          </body>
        </html>
        EOF
        exec nginx -g 'daemon off;'

  # AIOStreams (also exposed on a dedicated host port so FilmBox VPS can reach it over Tailscale)
  aiostreams:
    image: viren070/aiostreams:latest
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3010:3000"
    environment:
      - SECRET_KEY=${APP_SEED}
      - BASE_URL=https://addon.getfilmbox.com
      - ADDON_URLS=https://torrentio.strem.fun/manifest.json
      - AIOSTREAMS_AUTH=admin:${APP_PASSWORD}
